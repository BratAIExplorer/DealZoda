# ── DealZoda Nginx Config ──────────────────────────────────────────────────────
# Proxies HTTPS → Next.js on port 3000
# HTTP redirects to HTTPS
# Replace YOURDOMAIN with dealzoda.com once DNS is pointed to the VPS

server {
    listen 80;
    server_name dealzoda.com www.dealzoda.com 76.13.179.32;

    # Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP → HTTPS (once SSL is set up)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name dealzoda.com www.dealzoda.com;

    # SSL certificates (managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/dealzoda.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dealzoda.com/privkey.pem;

    # SSL hardening
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"  always;
    add_header X-Content-Type-Options    "nosniff"     always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Max upload size (for future API use)
    client_max_body_size 10M;

    # Proxy to Next.js
    location / {
        proxy_pass         http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout settings
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Static assets caching
    location /_next/static/ {
        proxy_pass        http://web:3000;
        add_header        Cache-Control "public, max-age=31536000, immutable";
        proxy_cache_bypass "";
    }
}

